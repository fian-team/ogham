[workspace]
members = [".", "structure"]
resolver = "2"

[package]
name = "ogham"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Embeddable UI language and runtime for Rust applications: bytecode VM, reconciling widget tree, Skia rendering backend"
license = "MIT"
repository = "https://github.com/fian-team/ogham"
keywords = ["ui", "framework", "language", "flexbox"]
categories = ["gui"]

[[bin]]
name = "ogham-lsp"
path = "src/lsp/main.rs"

[[bin]]
name = "ogham-vocab"
path = "src/bin/vocab.rs"

[lib]
name = "ogham"
path = "src/lib.rs"

[dependencies]
# APPLICATION.md §2's dependency edge, in the direction that does **not**
# hold. Two things ride on it, and they are different in kind:
#
#   1. `src/route/` — scaffolding. It re-exports the structure crate's route
#      types and keeps the `Route` trait, whose signatures name surface
#      types. WP-4.1 moved the *mechanism* into `lorekeeper/driver`; the
#      surface stays until the three games' migrations (P6) rewrite their
#      `impl Route` blocks, which is the first moment it can go.
#   2. `src/contract.rs` — **not** scaffolding, and the real blocker. WP-2.4
#      put the document-loading half of §4.1's validation here on purpose
#      (grading has no I/O and lives in the dependency-free crate;
#      translation and file reading live where the parser is), and it names
#      `structure::{Store, Kind, Validation, Vocabulary}` to do it. No
#      deletion in P4 reaches it: by §2's own reading the harness is a
#      *binding*, and the question of whether it should move into the driver
#      crate is a maintainer's, recorded in the P4 report.
#
# The load-bearing half — `cargo tree -p structure` shows no ogham — holds
# absolutely and is checked at every phase gate.
structure = { path = "structure" }
downcast-rs = "2.0.1"
skia-safe = { version = "0.91.0", features = ["vulkan", "textlayout"] }
lodepng = "3.12.1"
nalgebra-glm = "0.19.0"
notify = "6.1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]