[workspace]
members = ["."]
resolver = "2"

[package]
name = "ogham"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Embeddable UI language and runtime for Rust applications: bytecode VM, reconciling widget tree, Skia rendering backend"
license = "MIT"
repository = "https://github.com/fian-team/ogham"
keywords = ["ui", "framework", "language", "flexbox"]
categories = ["gui"]

[[bin]]
name = "ogham-lsp"
path = "src/lsp/main.rs"

[[bin]]
name = "ogham-vocab"
path = "src/bin/vocab.rs"

[lib]
name = "ogham"
path = "src/lib.rs"

[dependencies]
downcast-rs = "2.0.1"
skia-safe = { version = "0.91.0", features = ["vulkan", "textlayout"] }
lodepng = "3.12.1"
nalgebra-glm = "0.19.0"
notify = "6.1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]