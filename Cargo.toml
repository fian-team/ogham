[workspace]
members = [".", "structure", "contract"]
resolver = "2"

[package]
name = "ogham"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Embeddable UI language and runtime for Rust applications: bytecode VM, reconciling widget tree, Skia rendering backend"
license = "MIT"
repository = "https://github.com/fian-team/ogham"
keywords = ["ui", "framework", "language", "flexbox"]
categories = ["gui"]

[[bin]]
name = "ogham-lsp"
path = "src/lsp/main.rs"

[[bin]]
name = "ogham-vocab"
path = "src/bin/vocab.rs"

[lib]
name = "ogham"
path = "src/lib.rs"

[dependencies]
# APPLICATION.md §2's dependency edge, in the direction that does **not**
# hold yet. Exactly one thing rides on it, and it is scheduled scaffolding:
# `src/route/`, which re-exports the structure crate's route types and
# keeps the `Route` trait, whose signatures name surface types. WP-4.1
# moved the *mechanism* into `lorekeeper/driver`; the surface stays until
# the three games' migrations (P6) rewrite their `impl Route` blocks and
# their ~90 `use ogham::route::{…}` sites, which is the first moment it can
# go. The maintainer moved that check to the P6 gate for that reason.
#
# The other thing that used to ride on it — the document contract — no
# longer does: it is the `contract/` crate, which depends on this one and
# on `structure` and on nothing else. §2 says "only the binding depends on
# both", not "there is exactly one binding", and holding a document to its
# scopes' contract needs the parser and the store, so by §2's own
# definition it is a binding.
#
# The load-bearing half — `cargo tree -p structure` shows no ogham — holds
# absolutely and is checked at every phase gate.
structure = { path = "structure" }
downcast-rs = "2.0.1"
skia-safe = { version = "0.91.0", features = ["vulkan", "textlayout"] }
lodepng = "3.12.1"
nalgebra-glm = "0.19.0"
notify = "6.1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]